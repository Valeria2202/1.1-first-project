<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Рецепты</title>
</head>
<body>

{% if error_message %}
    <p style="color: red;">Ошибка: {{ error_message }}</p>
{% endif %}

{% if recipe %}
    <h2>Рецепт:</h2>
    {% for ingredient, amount in recipe.items %}
        <p>{{ ingredient }}: {{ amount }}</p>
    {% endfor %}
{% else %}
    <p>Такого рецепта не знаю :(</p>
{% endif %}

</body>
</html>
